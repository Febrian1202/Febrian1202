name: Waka Readme
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"
jobs:
  update-readme:
    name: Update this repo's README
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          TIME_RANGE: all_time
          BLOCKS: ⣀⣄⣤⣦⣶⣷⣿
          CODE_LANG: txt
          SHOW_TIME: true
          SHOW_TOTAL: true
          IGNORED_LANGUAGES: Markdown YAML JSON TOML txt CSV XML INI
